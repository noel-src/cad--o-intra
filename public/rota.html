<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rota | Cadê o Intra? | UFC</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           ÁREA GERAL DA ROTA
           O FUNDO OCUPA TODA A ÁREA ENTRE HEADER E NAV
        ===================================================== */

        body {
            margin: 0;
            background: #e5f5ff;
        }


        .rota-area {

            position: relative;

            min-height: calc(100vh - 68px);

            padding:
                0
                20px
                90px;

            box-sizing: border-box;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #e5f5ff 0%,
                    #ccebf8 50%,
                    #e1f2e6 100%
                );

        }


        /* =====================================================
           DECORAÇÕES DO FUNDO
        ===================================================== */

        .area-verde {

            position: absolute;

            width: 320px;

            height: 220px;

            border-radius: 50%;

            background:
                rgba(106, 185, 126, .15);

            pointer-events: none;

        }


        .area-verde-1 {

            top: -80px;

            left: -100px;

            transform: rotate(-15deg);

        }


        .area-verde-2 {

            bottom: -80px;

            right: -100px;

            transform: rotate(20deg);

        }


        .area-brilho {

            position: absolute;

            width: 500px;

            height: 500px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.18);

            top: 35%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            pointer-events: none;

        }




/* =====================================================
   HUD DA ROTA
   Camada visual entre o cabeçalho e o conteúdo da rota
===================================================== */

.rota-hud {
    position: relative;
    z-index: 5;

    width: 100vw;
    max-width: none;

    margin-top: -14px;
    margin-left: calc((100% - 100vw) / 2);
    margin-right: 0;
    margin-bottom: 28px;

    background: #ffffff;

    border-top: 1px solid #e5edf5;
    border-bottom: 1px solid #e5edf5;
    border-left: none;
    border-right: none;
    border-radius: 0;

    padding: 12px 5%;

    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;

    box-shadow:
        0 8px 24px rgba(15, 23, 42, 0.14),
        0 2px 6px rgba(15, 23, 42, 0.08);
}


/* BLOCO DA ESQUERDA */

.rota-hud .hud-bloco {
    display: flex;
    align-items: center;
    gap: 12px;

    justify-self: start;
}


/* ÍCONE */

.rota-hud .hud-icone {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f2f8fd;

    border: 1px solid #e5edf5;
    border-radius: 13px;

    font-size: 22px;
}


/* TEXTO */

.rota-hud .hud-texto {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
}

.rota-hud .hud-texto strong {
    color: #19385a;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.2;
}

.rota-hud .hud-label {
    color: #8493a3;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}


/* DIVISOR */

.rota-hud .hud-divisor {
    width: 1px;
    height: 42px;

    background: #dfe7ee;

    margin: 0 28px;
}


/* BLOCO DA DIREITA */

.rota-hud .hud-paradas {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;

    justify-self: end;

    white-space: nowrap;
}

.rota-hud .hud-paradas .hud-texto {
    text-align: left;
    white-space: nowrap;
}

.rota-hud .hud-paradas strong {
    color: #19385a;
    font-size: 17px;
    font-weight: 700;
    white-space: nowrap;
}

.rota-hud .hud-paradas span {
    color: #8493a3;
    font-size: 13px;
    white-space: nowrap;
}

.rota-hud .hud-seta {
    width: 42px;
    height: 42px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f2f8fd;
    border-radius: 50%;

    color: #318bc9;
    font-size: 24px;
    line-height: 1;
}


/* TEXTO DAS PARADAS */

.rota-hud .hud-paradas .hud-texto {
    text-align: left;
}

.rota-hud .hud-paradas strong {
    color: #19385a;
    font-size: 17px;
    font-weight: 700;
}

.rota-hud .hud-paradas span {
    color: #8493a3;
    font-size: 13px;
}


/* SETA */

.rota-hud .hud-seta {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #f2f8fd;

    border-radius: 50%;

    color: #318bc9;
    font-size: 24px;
}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 700px) {

    .rota-hud {
        width: 100vw;

        margin-top: -10px;
        margin-left: calc((100% - 100vw) / 2);
        margin-right: 0;
        margin-bottom: 20px;

        padding: 11px 18px;

        grid-template-columns: 1fr auto 1fr;
    }

    .rota-hud .hud-bloco {
        gap: 8px;
    }

    .rota-hud .hud-icone {
        width: 35px;
        height: 35px;

        font-size: 18px;
        border-radius: 10px;

        flex-shrink: 0;
    }

    .rota-hud .hud-texto {
        min-width: 0;
    }

    .rota-hud .hud-texto strong {
        font-size: 14px;
        white-space: nowrap;
    }

    .rota-hud .hud-label {
        font-size: 8px;
        white-space: nowrap;
    }

    .rota-hud .hud-divisor {
        height: 34px;
        margin: 0 12px;
    }

    /* ======================================
       PARADAS + SETA
    ====================================== */

    .rota-hud .hud-paradas {
        display: flex;
        align-items: center;
        justify-content: flex-end;

        gap: 7px;

        white-space: nowrap;
        min-width: 0;
    }

    .rota-hud .hud-paradas .hud-texto {
        min-width: 0;
        white-space: nowrap;
    }

    .rota-hud .hud-paradas strong {
        font-size: 14px;
        white-space: nowrap;
    }

    .rota-hud .hud-paradas span {
        font-size: 11px;
        white-space: nowrap;
    }

    .rota-hud .hud-seta {
        width: 35px;
        height: 35px;

        flex-shrink: 0;

        font-size: 20px;
    }
}

    display: flex;

.hud-seta {

}


.hud-seta svg {

    width: 16px;

        /* =====================================================
           CONTEÚDO DA ROTA
        ===================================================== */

        .rota-conteudo {

            position: relative;

            z-index: 5;

            width: min(900px, 100%);

            margin: 0 auto;

        }


        .rota-titulo {

            margin-bottom: 20px;

        }


        .rota-titulo .label {

            display: block;

            margin-bottom: 5px;

            color: #398cc0;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: .7px;

            text-transform: uppercase;

        }


        .rota-titulo h1 {

            margin: 0;

            color: #173b60;

            font-size: 28px;

            font-weight: 700;

            letter-spacing: -.6px;

        }


        .rota-titulo p {

            margin: 6px 0 0;

            color: #657784;

            font-size: 13px;

        }


        /* =====================================================
           SISTEMA DA ROTA
           ESTE É O FUNDO PRINCIPAL DA ROTA
        ===================================================== */

        .mapa-rota {

            position: relative;

            width: 100%;

            height: 590px;

            overflow: hidden;

            border-radius: 28px;

            background:
                rgba(255,255,255,.16);

            border:
                1px solid rgba(255,255,255,.40);

            box-shadow:
                0 12px 35px
                rgba(24,75,110,.10);

        }


        .mapa-rota::before {

            content: "";

            position: absolute;

            inset: 0;

            opacity: .28;

            background-image:
                radial-gradient(
                    circle at 20% 20%,
                    #ffffff 0 2px,
                    transparent 3px
                );

            background-size: 70px 70px;

            pointer-events: none;

        }


        /* =====================================================
           LINHA DA ROTA
        ===================================================== */

        .rota-linha {

            position: absolute;

            left: 50%;

            top: 45px;

            width: 8px;

            height: 500px;

            transform:
                translateX(-50%);

            border-radius: 20px;

            background:
                rgba(255,255,255,.95);

            box-shadow:
                0 0 0 4px
                rgba(50,135,190,.10);

            z-index: 2;

        }


        .rota-linha::after {

            content: "";

            position: absolute;

            left: 50%;

            top: 0;

            width: 4px;

            height: 100%;

            transform:
                translateX(-50%);

            background:
                repeating-linear-gradient(
                    to bottom,
                    #398cc0 0,
                    #398cc0 18px,
                    transparent 18px,
                    transparent 32px
                );

            border-radius: 20px;

        }


        /* =====================================================
           ÔNIBUS
        ===================================================== */

        .onibus-rota {

            position: absolute;

            left: 50%;

            top: 16px;

            width: 48px;

            height: 48px;

            transform:
                translateX(-50%);

            z-index: 15;

            pointer-events: none;

        }


        .onibus-rota svg {

            width: 100%;

            height: 100%;

            filter:
                drop-shadow(
                    0 5px 7px
                    rgba(20,70,100,.20)
                );

        }


        /* =====================================================
           PONTOS
        ===================================================== */

        .ponto {

            position: absolute;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 20;

        }


        .ponto-1 {
            top: 38px;
        }

        .ponto-2 {
            top: 112px;
        }

        .ponto-3 {
            top: 186px;
        }

        .ponto-4 {
            top: 260px;
        }

        .ponto-5 {
            top: 334px;
        }

        .ponto-6 {
            top: 408px;
        }

        .ponto-7 {
            top: 482px;
        }


        .ponto-botao {

            position: relative;

            width: 28px;

            height: 28px;

            padding: 0;

            border-radius: 50%;

            border: 5px solid white;

            background: #3188bd;

            box-shadow:
                0 4px 12px
                rgba(20,75,110,.20);

            cursor: pointer;

            transition:
                transform .25s ease,
                box-shadow .25s ease;

        }


        .ponto-botao:hover {

            transform:
                scale(1.13);

        }


        .ponto-botao.inicio {

            background: #19a974;

        }


        .ponto-botao.destino {

            background: #246bce;

        }


        .ponto.selecionado
        .ponto-botao {

            transform:
                scale(1.35);

            box-shadow:
                0 0 0 8px
                rgba(49,136,189,.15),

                0 7px 18px
                rgba(20,75,110,.24);

        }


        /* =====================================================
           NOMES DOS PONTOS
        ===================================================== */

        .ponto-label {

            position: absolute;

            top: 50%;

            width: 145px;

            transform:
                translateY(-50%);

            padding: 11px 13px;

            border-radius: 14px;

            background:
                rgba(255,255,255,.95);

            border:
                1px solid
                rgba(255,255,255,.8);

            box-shadow:
                0 6px 18px
                rgba(30,80,110,.10);

            cursor: pointer;

            transition:
                transform .25s ease,
                box-shadow .25s ease;

        }


        .ponto-label:hover {

            box-shadow:
                0 9px 22px
                rgba(30,80,110,.16);

        }


        .ponto-label.esquerda {

            right: 45px;

            text-align: right;

        }


        .ponto-label.direita {

            left: 45px;

        }


        .ponto-label strong {

            display: block;

            color: #173b60;

            font-size: 13px;

            font-weight: 700;

        }


        .ponto-label span {

            display: block;

            margin-top: 3px;

            color: #7a8794;

            font-size: 10px;

        }


        /* =====================================================
           PAINEL FLUTUANTE
        ===================================================== */

        .painel-ponto {

            position: absolute;

            width: 220px;

            padding: 15px;

            box-sizing: border-box;

            border-radius: 17px;

            background:
                rgba(255,255,255,.98);

            box-shadow:
                0 12px 28px
                rgba(20,70,100,.20);

            border:
                1px solid
                rgba(255,255,255,.9);

            opacity: 0;

            visibility: hidden;

            transform:
                translateY(8px)
                scale(.96);

            transition:
                opacity .25s ease,
                transform .25s ease,
                visibility .25s ease;

            z-index: 100;

        }


        .painel-ponto.aberto {

            opacity: 1;

            visibility: visible;

            transform:
                translateY(0)
                scale(1);

        }


        .painel-ponto::after {

            content: "";

            position: absolute;

            width: 12px;

            height: 12px;

            background: white;

            transform:
                rotate(45deg);

        }


        .painel-ponto.esquerda::after {

            right: -6px;

            top: 30px;

        }


        .painel-ponto.direita::after {

            left: -6px;

            top: 30px;

        }


        .painel-topo {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 10px;

        }


        .painel-local {

            display: flex;

            gap: 10px;

            align-items: flex-start;

        }


        .painel-icone {

            width: 34px;

            height: 34px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            background: #eaf5fb;

            color: #2377aa;

        }


        .painel-icone svg {

            width: 18px;

            height: 18px;

        }


        .painel-texto h3 {

            margin: 0;

            color: #173b60;

            font-size: 15px;

        }


        .painel-texto p {

            margin: 3px 0 0;

            color: #718096;

            font-size: 11px;

            line-height: 1.4;

        }


        .fechar-painel {

            width: 27px;

            height: 27px;

            border: none;

            border-radius: 50%;

            background: #f2f5f7;

            color: #718096;

            font-size: 17px;

            line-height: 1;

            cursor: pointer;

        }


        .botao-mapa {

            width: 100%;

            margin-top: 12px;

            padding: 10px 12px;

            border: none;

            border-radius: 11px;

            background: #2079ae;

            color: white;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform .2s ease,
                background .2s ease;

        }


        .botao-mapa:hover {

            transform:
                translateY(-1px);

            background: #17658f;

        }


        /* =====================================================
           LEGENDA
        ===================================================== */

        .rota-legenda {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 18px;

            margin-top: 15px;

        }


        .legenda-item {

            display: flex;

            align-items: center;

            gap: 6px;

            font-size: 11px;

            font-weight: 500;

        }


        .legenda-ponto {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: #3188bd;

        }


        .legenda-ponto.inicio {

            background: #19a974;

        }


        .legenda-ponto.destino {

            background: #246bce;

        }

<!-- =====================================================
     CABEÇALHO
     EXATAMENTE O MESMO DO INDEX.HTML
====================================================== -->

<header class="header">

    <div class="logo">

        <img
            src="/logo.png"
            alt="Cadê o Intra?"
        >

    </div>


    <div class="header-status">

        <span class="status-dot"></span>

        Sistema online

    </div>

</header>



<!-- =====================================================
     ÁREA COMPLETA DA ROTA
====================================================== -->

<main class="rota-area">


    <div class="area-verde area-verde-1"></div>

    <div class="area-verde area-verde-2"></div>

    <div class="area-brilho"></div>



    <div class="rota-conteudo">


        <!-- =================================================
             HUD DA ROTA
             Fica logo abaixo do cabeçalho e resume a rota.
             A quantidade de paradas é preenchida pelo JavaScript.
        ================================================== -->

        <section class="rota-hud" aria-label="Resumo da rota">

            <div class="hud-bloco hud-rota">

                <div class="hud-icone">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <rect x="5" y="3" width="14" height="15" rx="3"></rect>
                        <path d="M8 18v2"></path>
                        <path d="M16 18v2"></path>
                        <path d="M7 7h10"></path>
                        <path d="M8 11h.01"></path>
                        <path d="M16 11h.01"></path>
                    </svg>
                </div>

                <div class="hud-texto">
                    <strong>Rota ilustrativa</strong>
                </div>

            </div>

            <div class="hud-divisor"></div>

            <div class="hud-bloco hud-paradas">

                <div class="hud-icone hud-icone-paradas">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <circle cx="6" cy="6" r="2.5"></circle>
                        <circle cx="18" cy="18" r="2.5"></circle>
                        <path d="M8.5 6H12a4 4 0 0 1 4 4v5.5"></path>
                        <path d="M15.5 18H12a4 4 0 0 1-4-4V8.5"></path>
                    </svg>
                </div>

                <div class="hud-texto">
                    <strong id="quantidadeParadas">0 paradas</strong>
                    <span>Intercampi</span>
                </div>

            </div>

            <div class="hud-seta" aria-hidden="true">

<script>

    /*
       DADOS DOS PONTOS
    */

    const pontos = [

        {
            nome: "Mucambinho",
            descricao: "Ponto inicial da rota.",
            latitude: -3.692662,
            longitude: -40.355196
        },

        {
            nome: "Santa Casa",
            descricao: "Ponto de parada do Intra.",
            latitude: -3.692542,
            longitude: -40.359015
        },

        {
            nome: "SPA",
            descricao: "Ponto de parada do Intra.",
            latitude: -3.688644,
            longitude: -40.353047
        },

        {
            nome: "Cadeia Criativa",
            descricao: "Ponto de parada do Intra.",
            latitude: -3.684791,
            longitude: -40.351818
        },

        {
            nome: "Goiabão",
            descricao: "Ponto de parada do Intra.",
            latitude: -3.683724,
            longitude: -40.342820
        },

        {
            nome: "Receita Federal",
            descricao: "Ponto de parada do Intra.",
            latitude: -3.683589,
            longitude: -40.342269
        },

        {
            nome: "FAMED",
            descricao: "Destino da rota.",
            latitude: -3.682058,
            longitude: -40.337247
        }

    ];


    // Atualiza o HUD automaticamente conforme a lista real de paradas.
    const elementoQuantidadeParadas =
        document.getElementById("quantidadeParadas");

    if (elementoQuantidadeParadas) {
        const quantidade = pontos.length;
        elementoQuantidadeParadas.textContent =
            quantidade === 1
                ? "1 parada"
                : `${quantidade} paradas`;
    }


    let pontoSelecionado = null;



    /*
       SELECIONAR PONTO
    */

    function selecionarPonto(indice) {

        pontoSelecionado =
            pontos[indice];


        const ponto =
            document.querySelectorAll(
                ".ponto"
            )[indice];


        const mapa =
            document.getElementById(
                "mapaRota"
            );


        const painel =
            document.getElementById(
                "painelPonto"
            );


        document
            .querySelectorAll(".ponto")
            .forEach(function(elemento) {

                elemento.classList.remove(
                    "selecionado"
                );

            });


        ponto.classList.add(
            "selecionado"
        );


        document.getElementById(
            "nomePonto"
        ).textContent =
            pontoSelecionado.nome;


        document.getElementById(
            "descricaoPonto"
        ).textContent =
            pontoSelecionado.descricao;


        painel.classList.add(
            "aberto"
        );


        const mapaRect =
            mapa.getBoundingClientRect();


        const pontoRect =
            ponto.getBoundingClientRect();


        const centroX =
            pontoRect.left -
            mapaRect.left +
            pontoRect.width / 2;


        const centroY =
            pontoRect.top -
            mapaRect.top +
            pontoRect.height / 2;


        const painelRect =
            painel.getBoundingClientRect();


        let esquerda;

        let topo;


        if (
            centroX <
            mapaRect.width / 2
        ) {

            painel.classList.remove(
                "esquerda"
            );

            painel.classList.add(
                "direita"
            );


            esquerda =
                centroX + 35;

        } else {

            painel.classList.remove(
                "direita"
            );

            painel.classList.add(
                "esquerda"
            );


            esquerda =
                centroX -
                painelRect.width -
                35;

        }


        topo =
            centroY -
            painelRect.height / 2;


        const margem = 10;


        if (
            esquerda < margem
        ) {

            esquerda = margem;

        }


        if (
            esquerda +
            painelRect.width >
            mapaRect.width -
            margem
        ) {

            esquerda =
                mapaRect.width -
                painelRect.width -
                margem;

        }


        if (
            topo < margem
        ) {

            topo = margem;

        }


        if (
            topo +
            painelRect.height >
            mapaRect.height -
            margem
        ) {

            topo =
                mapaRect.height -
                painelRect.height -
                margem;

        }


        painel.style.left =
            esquerda + "px";


        painel.style.top =
            topo + "px";

    }



    /*
       FECHAR PAINEL
    */

    function fecharPainel() {

        document
            .getElementById(
                "painelPonto"
            )
            .classList.remove(
                "aberto"
            );


        document
            .querySelectorAll(".ponto")
            .forEach(function(elemento) {

                elemento.classList.remove(
                    "selecionado"
                );

            });


        pontoSelecionado = null;

    }



    /*
     VER NO MAPA
    */

    function verNoMapa() {

        if (!pontoSelecionado) {
            return;
        }


        window.location.href =
            "/?lat=" +
            pontoSelecionado.latitude +
            "&lng=" +
            pontoSelecionado.longitude +
            "&ponto=" +
            encodeURIComponent(
                pontoSelecionado.nome
            );

    }



    /*
       RECALCULAR PAINEL AO REDIMENSIONAR
    */

    window.addEventListener(
        "resize",
        function() {

            if (
                pontoSelecionado !== null
            ) {

                selecionarPonto(
                    pontos.indexOf(
                        pontoSelecionado
                    )
                );

            }

        }
    );

</script>
